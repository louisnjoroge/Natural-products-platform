<head>

<title>Asili — Welcome</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes sway{0%,100%{transform:rotate(0deg)}50%{transform:rotate(2.5deg)}}
@keyframes drip{0%{transform:translateY(0);opacity:0}15%{opacity:1}80%{transform:translateY(28px);opacity:1}100%{transform:translateY(32px);opacity:0}}
@keyframes mote{0%{transform:translateY(0);opacity:0}30%{opacity:.9}100%{transform:translateY(-60px);opacity:0}}
.fl{animation:fl 6s ease-in-out infinite;transform-box:fill-box}
.fl2{animation:fl 7.5s ease-in-out -2s infinite;transform-box:fill-box}
.sw{animation:sway 8s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.dp{animation:drip 3.2s ease-in infinite;transform-box:fill-box}
.mo{animation:mote 5s ease-out infinite;transform-box:fill-box}
@media (prefers-reduced-motion:reduce){.fl,.fl2,.sw,.dp,.mo{animation:none}}
</style>
<style>
html{background:#DCDAD2}
body{display:flex;justify-content:center;min-height:100vh}
body>div{flex-shrink:0}
@media (max-width:430px){html{background:#F7F6F1}}
</style>
</head>
