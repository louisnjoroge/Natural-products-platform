<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asili for Makers — New invoice</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
<style>
html{background:#DCDAD2}
body{display:flex;justify-content:center;min-height:100vh}
body>div{flex-shrink:0}
@media (max-width:430px){html{background:#F7F6F1}}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F7F6F1; font-family: Inter, sans-serif; color: #17241C; padding: 16px; display: flex; flex-direction: column; gap: 12px">
  <div style="display: flex; align-items: center; gap: 8px">
    <a href="maker-home.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#17241C" stroke-width="2" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
    <h1 style="flex: 1; margin: 0; font: 700 22px 'Bricolage Grotesque', sans-serif">New invoice</h1>
    <span style="font-size: 12px; color: #5C665F">INV-2026-0042</span>
  </div>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <div style="display: flex; flex-direction: column; gap: 4px"><label for="cname" style="font-size: 12px; font-weight: 600">Customer</label><input id="cname" value="Achieng O." style="height: 44px; box-sizing: border-box; border: 1px solid #D5D3C9; border-radius: 10px; padding: 0 12px; font: 500 14px Inter, sans-serif; color: #17241C; background: #FFFFFF; width: 100%"></div>
    <div style="display: flex; flex-direction: column; gap: 4px"><label for="cphone" style="font-size: 12px; font-weight: 600">Phone (M-Pesa)</label><input id="cphone" type="tel" value="07XX XXX XXX" style="height: 44px; box-sizing: border-box; border: 1px solid #D5D3C9; border-radius: 10px; padding: 0 12px; font: 500 14px Inter, sans-serif; color: #17241C; background: #FFFFFF; width: 100%"></div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 4px"><label for="cpin" style="font-size: 12px; font-weight: 600">Customer KRA PIN <span style="font-weight: 400; color: #5C665F">(optional, for business buyers)</span></label><input id="cpin" placeholder="e.g. A000000000X" style="height: 44px; box-sizing: border-box; border: 1px solid #D5D3C9; border-radius: 10px; padding: 0 12px; font: 500 14px Inter, sans-serif; color: #17241C; background: #FFFFFF; width: 100%"></div>
  <section style="background: #FFFFFF; border: 1px solid #E3E1D8; border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; gap: 10px; align-items: center"><div style="width: 40px; height: 40px; border-radius: 10px; background: #D9D7D0; flex: 0 0 40px"></div><div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 600">Charcoal &amp; Tea Tree Bar</span><span style="font-size: 12px; color: #5C665F">3 × KES 450</span></div><span style="font-size: 14px; font-weight: 700">KES 1,350</span></div>
    <button style="height: 40px; border: 1.5px dashed #8C948E; border-radius: 10px; background: transparent; font: 600 13px Inter, sans-serif; color: #1E5B3F">+ Add item from your stock</button>
  </section>
  <div style="display: flex; flex-direction: column; gap: 6px; font-size: 14px">
    <div style="display: flex; justify-content: space-between"><span style="color: #5C665F">Subtotal</span><span>KES 1,350</span></div>
    <div style="display: flex; justify-content: space-between"><span style="color: #5C665F">VAT</span><span style="color: #5C665F">Not VAT-registered</span></div>
    <div style="display: flex; justify-content: space-between; font-weight: 700; font-size: 16px; padding-top: 6px; border-top: 1px solid #E3E1D8"><span>Total</span><span>KES 1,350</span></div>
  </div>
  <div style="background: #E4EEE6; border-radius: 12px; padding: 10px 12px; display: flex; gap: 10px; align-items: flex-start">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1E5B3F" stroke-width="2" aria-hidden="true" style="flex: 0 0 20px"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"></path><path d="M9 12l2 2 4-4"></path></svg>
    <span style="font-size: 12px; line-height: 1.45">Sent to <strong>KRA eTIMS</strong> when you tap Send. The buyer gets the KRA-validated invoice. 3 bars are held now and deducted when paid.</span>
  </div>
  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
    <button style="height: 52px; border: none; border-radius: 14px; background: #1E5B3F; color: #FFFFFF; font: 600 15px Inter, sans-serif">Send invoice + M-Pesa request</button>
    <button style="height: 44px; border: 1px solid #D5D3C9; border-radius: 12px; background: #FFFFFF; font: 600 14px Inter, sans-serif; color: #17241C">Share PDF on WhatsApp instead</button>
  </div>
</div>
</body>
</html>
