<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asili — Checkout</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
<style>
html{background:#DCDAD2}
body{display:flex;justify-content:center;min-height:100vh}
body>div{flex-shrink:0}
@media (max-width:430px){html{background:#F7F6F1}}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F7F6F1; font-family: Inter, sans-serif; color: #17241C; padding: 16px; display: flex; flex-direction: column; gap: 14px">
  <div style="display: flex; align-items: center; gap: 8px">
    <a href="product.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#17241C" stroke-width="2" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
    <h1 style="margin: 0; font: 700 22px 'Bricolage Grotesque', sans-serif">Your order</h1>
  </div>
  <section style="background: #FFFFFF; border: 1px solid #E3E1D8; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 600">Wendy's Naturals</span><span style="font-size: 12px; color: #5C665F">Recommended by Vera's Botanicals</span></div>
    <div style="display: flex; gap: 12px; align-items: center">
      <div style="width: 52px; height: 52px; flex: 0 0 52px; border-radius: 10px; background: #CFE0D3"></div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; font-weight: 600">Whipped Goat Milk &amp; Shea</span><span style="font-size: 13px; color: #5C665F">KES 600</span></div>
      <div style="display: flex; align-items: center; gap: 4px; border: 1px solid #D5D3C9; border-radius: 10px">
        <button aria-label="Decrease quantity" style="width: 36px; height: 36px; border: none; background: none; font-size: 18px">−</button><span style="font-weight: 600; min-width: 16px; text-align: center">1</span><button aria-label="Increase quantity" style="width: 36px; height: 36px; border: none; background: none; font-size: 18px">+</button>
      </div>
    </div>
  </section>
  <fieldset style="border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
    <legend style="font: 600 15px 'Bricolage Grotesque', sans-serif; margin-bottom: 8px">How do you want it?</legend>
    <label style="display: flex; gap: 12px; align-items: center; background: #FFFFFF; border: 2px solid #1E5B3F; border-radius: 14px; padding: 12px">
      <input type="radio" name="delivery" checked="checked" style="accent-color: #1E5B3F; width: 18px; height: 18px">
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 600">Wendy sends a rider</span><span style="font-size: 12px; color: #5C665F">To Rose Ave, Kilimani · today</span></span>
      <span style="font-size: 14px; font-weight: 600">KES 200</span>
    </label>
    <label style="display: flex; gap: 12px; align-items: center; background: #FFFFFF; border: 1px solid #E3E1D8; border-radius: 14px; padding: 12px">
      <input type="radio" name="delivery" style="accent-color: #1E5B3F; width: 18px; height: 18px">
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 600">I'll pick it up</span><span style="font-size: 12px; color: #5C665F">Ngong Rd area · exact spot shared after payment</span></span>
      <span style="font-size: 14px; font-weight: 600">Free</span>
    </label>
  </fieldset>
  <div style="display: flex; flex-direction: column; gap: 6px">
    <label for="mpesa" style="font-size: 13px; font-weight: 600">M-Pesa number</label>
    <input id="mpesa" type="tel" value="07XX XXX XXX" style="height: 48px; box-sizing: border-box; border: 1px solid #D5D3C9; border-radius: 12px; padding: 0 14px; font: 500 15px Inter, sans-serif; color: #17241C; background: #FFFFFF">
  </div>
  <div style="display: flex; flex-direction: column; gap: 6px; font-size: 14px">
    <div style="display: flex; justify-content: space-between"><span style="color: #5C665F">Soap</span><span>KES 600</span></div>
    <div style="display: flex; justify-content: space-between"><span style="color: #5C665F">Delivery</span><span>KES 200</span></div>
    <div style="display: flex; justify-content: space-between; font-weight: 700; font-size: 16px; padding-top: 6px; border-top: 1px solid #E3E1D8"><span>Total</span><span>KES 800</span></div>
  </div>
  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
    <button style="height: 52px; border: none; border-radius: 14px; background: #1E5B3F; color: #FFFFFF; font: 600 16px Inter, sans-serif">Pay KES 800 with M-Pesa</button>
    <span style="font-size: 12px; color: #5C665F; text-align: center">You'll get a prompt on your phone. Enter your M-Pesa PIN there.</span>
    <a href="maker.html" style="font-size: 13px; font-weight: 600; color: #1E5B3F; text-align: center; padding: 6px">Prefer to talk first? Order on WhatsApp</a>
  </div>
</div>
</body>
</html>
